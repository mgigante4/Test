name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  CEDEV: ${{ github.workspace }}/CEdev
  CEDEV_BIN: ${{ github.workspace }}/CEdev/bin

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install host deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3

      - name: Sync submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1

      - name: Download CE Toolchain
        run: |
          curl -L -o CEdev-Linux.tar.gz https://github.com/CE-Programming/toolchain/releases/download/v14.2/CEdev-Linux.tar.gz
          tar -xzf CEdev-Linux.tar.gz
          echo "${{ env.CEDEV_BIN }}" >> "$GITHUB_PATH"

      - name: Build pack AppVars
        run: python3 tools/build_pack.py

      - name: Build viewer program
        run: |
          cmake -S viewer -B build/ce -G Ninja -DCEDEV_ROOT="${{ env.CEDEV }}"
          cmake --build build/ce

      - name: Collect bundle inputs
        run: |
          mkdir -p bundle_inputs artifact
          cp dist/8xv/*.8xv bundle_inputs/
          cp external/libtexce/assets/TeXFonts.8xv external/libtexce/assets/TeXScrpt.8xv bundle_inputs/
          find build/ce -name '*.8xp' -exec cp {} bundle_inputs/ \;

      # First try exactly the original, one-file auto-extracting bundle.
      # If convbin reports 'Input too large', divide the inputs and retry.
      # All groups use the same AppVar names; send ALL .8xg files to the TI-84 CE.
      - name: Build groups (automatically split oversized bundle)
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess
          import sys

          source = pathlib.Path('bundle_inputs')
          dest = pathlib.Path('artifact')
          dest.mkdir(exist_ok=True)
          files = sorted([*source.glob('*.8xv'), *source.glob('*.8xp')])
          if not files:
              sys.exit('No .8xv/.8xp files found')

          def try_group(items, output):
              cmd = ['convbin', '--oformat', '8xg-auto-extract', '--output', str(output)]
              for file in items:
                  cmd += ['--iformat', '8x', '--input', str(file)]
              result = subprocess.run(cmd, capture_output=True, text=True)
              if result.returncode != 0:
                  output.unlink(missing_ok=True)
                  return False, (result.stderr or result.stdout).strip()
              return True, ''

          single = dest / 'NOTES_BUNDLE.8xg'
          success, error = try_group(files, single)
          if success:
              print(f'Success: {single} ({len(files)} files)')
          else:
              print(f'Original one-file bundle failed: {error}')
              print('Dividing the calculator files into smaller transfer groups.')
              groups = []
              def split_until_builds(items):
                  test = dest / '_GROUP_TEST.8xg'
                  ok, reason = try_group(items, test)
                  if ok:
                      groups.append((items, test.read_bytes()))
                      test.unlink()
                      return
                  if len(items) == 1:
                      raise RuntimeError(f'Even one file cannot be bundled: {items[0]}: {reason}')
                  mid = len(items) // 2
                  split_until_builds(items[:mid])
                  split_until_builds(items[mid:])

              split_until_builds(files)
              for i, (items, data) in enumerate(groups, 1):
                  output = dest / f'NOTES_PART_{i:02d}.8xg'
                  output.write_bytes(data)
                  print(f'Created {output}: {len(items)} input files, {len(data)} bytes')

          outputs = sorted(dest.glob('*.8xg'))
          if not outputs:
              sys.exit('No group files created')
          print('Transfer EVERY .8xg output file to your calculator:')
          for output in outputs:
              print(' ', output)
          PY

      - name: Upload artifact bundles
        uses: actions/upload-artifact@v4
        with:
          name: notes-template-artifacts
          path: artifact/*.8xg
          if-no-files-found: error

      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifact/*.8xg
